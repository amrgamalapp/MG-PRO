<!doctype html><html lang=ar dir=rtl><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>MG Engineering Academy</title><style>body{font-family:Tahoma;background:#eef3f8;margin:0}.hero{background:#172b49;color:white;text-align:center;padding:35px}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:white;border-radius:14px;padding:18px;margin:12px 0}</style><header class=hero><h1>MG Engineering Academy</h1><h2>م/ محمد جمال عوض</h2><p>هندسة المساحة · Civil 3D · GIS · المكتب الفني</p><a href='https://wa.me/201070471353'>واتساب</a></header><main class=wrap><h2>الكورسات والدروس</h2><div id=list>تحميل...</div></main><script>function e(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}fetch('/api/courses').then(r=>r.json()).then(a=>document.getElementById('list').innerHTML=a.map(c=>`<article class=card><h3>${e(c.title)}</h3><p>${e(c.category)} — ${e(c.description)}</p>${c.video?`<a href="${e(c.video)}" target=_blank>مشاهدة الفيديو</a>`:''} ${c.file?`<a href="${e(c.file)}">ملف ${e(c.filename)}</a>`:''}</article>`).join('')||'سيتم إضافة الكورسات قريبًا.')</script></html>
