<!doctype html><html lang=ar dir=rtl><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>لوحة الإدارة</title><style>body{font-family:Tahoma;background:#f1f5f9}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:white;padding:18px;border-radius:14px;margin:12px 0}input,textarea,select,button{box-sizing:border-box;width:100%;padding:10px;margin:6px 0}button{background:#087f5b;color:white;border:0}.item{padding:12px;border:1px solid #ddd;margin:8px 0}</style><main class=wrap><h2>لوحة إدارة MG Academy</h2><form method=post action=/admin/logout><button>خروج</button></form><section class=card><h3>إضافة كورس</h3><form id=f><input name=title id=title placeholder=العنوان required><input name=category id=category placeholder=القسم><input name=video id=video type=url placeholder='رابط الفيديو'><textarea name=description id=description placeholder=الوصف></textarea><input id=file type=file><button>حفظ الكورس</button></form><p id=msg></p></section><section class=card><h3>المحتوى</h3><div id=list></div></section></main><script>const $=x=>document.getElementById(x);function e(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){let a=await(await fetch('/api/admin/courses')).json();$('list').innerHTML=a.map(c=>`<div class=item><b>${e(c.title)}</b><p>${e(c.category)} ${e(c.description)}</p><button onclick="del('${c.id}')">حذف</button></div>`).join('')||'لا توجد كورسات'}$('f').onsubmit=async ev=>{ev.preventDefault();let d=new FormData();['title','category','video','description'].forEach(k=>d.append(k,$(k).value));if($('file').files[0])d.append('file',$('file').files[0]);let r=await fetch('/api/admin/courses',{method:'POST',body:d});let j=await r.json();$('msg').textContent=r.ok?'تم الحفظ':j.error||'حدث خطأ';if(r.ok){$('f').reset();load()}}async function del(id){if(confirm('حذف الكورس؟')){let r=await fetch('/api/admin/courses/'+id,{method:'DELETE'});if(r.ok)load()}}load()</script></html>
