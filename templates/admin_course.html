{% extends 'base.html' %}{% block title %}إضافة كورس{% endblock %}{% block content %}<section class="auth wrap wide"><div class="auth-card"><span class="eyebrow">ADMIN</span><h1>إضافة كورس جديد</h1><form method="post"><div class="form-grid"><label>Slug<input name="slug" required placeholder="autocad-pro"></label><label>اسم الكورس<input name="title" required></label><label>العنوان الفرعي<input name="subtitle" required></label><label>التصنيف<input name="category" required></label><label>المستوى<input name="level" required></label><label>المدة<input name="duration"></label><label>السعر<input name="price" type="number"></label><label>السعر القديم<input name="old_price" type="number"></label><label>Icon<input name="icon" value="⌬"></label><label>Accent<input name="accent" value="gold"></label></div><label>الوصف<textarea name="description" required></textarea></label><label>☐ مميز <input type="checkbox" name="featured" value="1"></label><h3>الدروس</h3>{% for i in range(1,6) %}<label>درس {{i}}<input name="lesson_{{i}}"></label>{% endfor %}<button class="btn gold xl full">حفظ الكورس</button></form></div></section>{% endblock %}
