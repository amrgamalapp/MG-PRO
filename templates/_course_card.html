<article class="course-card"><div class="course-cover {{c['accent']}}"><span class="course-icon">{{c['icon']}}</span><span class="tag">{{c['category']}}</span><div class="cover-title">{{c['title']}}</div></div><div class="course-body"><div class="rating">★ {{c['rating']}} <small>({{c['students']}} طالب)</small></div><h3>{{c['title']}}</h3><p>{{c['subtitle']}}</p><div class="course-meta"><span>{{c['duration']}}</span><span>{{c['level']}}</span></div><div class="price">{% if c['old_price'] %}<del>{{c['old_price']|int}} ج.م</del>{% endif %}<b>{{c['price']|int}} ج.م</b><a href="{{url_for('course',slug=c['slug'])}}">التفاصيل ↗</a></div></div></article>
