<!-- FIREBASE INITIALIZATION & LOGIC -->
<script>
    // FIREBASE CONFIGURATION (المحدث)
    const firebaseConfig = {
        apiKey: "AIzaSyBO34EZgVpZquo1TWF52r47WujWZbqukFU",
        authDomain: "mgpro-2f83b.firebaseapp.com",
        databaseURL: "https://mgpro-2f83b-default-rtdb.firebaseio.com",
        projectId: "mgpro-2f83b",
        storageBucket: "mgpro-2f83b.firebasestorage.app",
        messagingSenderId: "964974315895",
        appId: "1:964974315895:web:be64f714bab53dd6437972",
        measurementId: "G-5H1EQDFBRS"
    };

    // Initialize Firebase & Database
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isGuest = false;
    let isSubscriber = false;

    function switchAuthTab(tab) {
        if(tab === 'login') {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('tabLoginBtn').className = 'flex-1 py-2 text-xs font-bold rounded-lg text-amber-500 bg-navy-800 transition';
            document.getElementById('tabRegisterBtn').className = 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition';
        } else {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('tabRegisterBtn').className = 'flex-1 py-2 text-xs font-bold rounded-lg text-amber-500 bg-navy-800 transition';
            document.getElementById('tabLoginBtn').className = 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition';
        }
    }

    function handleAuth(e, type) {
        e.preventDefault();
        if (type === 'login') {
            const phone = document.getElementById('loginPhone').value.trim();
            const btn = document.getElementById('loginBtnSubmit');
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> جاري التحقق...';

            if (phone === '01070471353') {
                activateUserSession('المهندس محمد جمال عوض (صاحب المنصة)');
                return;
            }

            db.ref('students/' + phone).once('value').then((snapshot) => {
                const studentData = snapshot.val();
                if (studentData && studentData.status === 'active') {
                    activateUserSession(studentData.name || phone);
                } else if (studentData && studentData.status === 'pending') {
                    alert('حسابك قيد التفعيل. يرجى إتمام الحجز مع المهندس محمد ليتم فتح المنصة لك فوراً.');
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> دخول المنصة';
                } else {
                    db.ref('students/' + phone).set({
                        phone: phone,
                        name: 'طالب جديد',
                        status: 'pending',
                        createdAt: new Date().toISOString()
                    });
                    alert('تم تسجيل طلبك! تواصل مع المهندس عبر الواتساب لتفعيل حسابك على هذا الرقم.');
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> دخول المنصة';
                }
            }).catch((err) => {
                console.error(err);
                alert('حدث خطأ في الاتصال بالخادم. حاول مجدداً.');
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> دخول المنصة';
            });

        } else if (type === 'register') {
            const name = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value.trim();

            db.ref('students/' + phone).set({
                phone: phone,
                name: name,
                status: 'pending',
                createdAt: new Date().toISOString()
            });

            const waUrl = `https://wa.me/201070471353?text=مرحباً%20مهندس%20محمد،%20أنا%20الطالب%20${encodeURIComponent(name)}%20ورقمي%20هو%20${encodeURIComponent(phone)}%D8%8C%20أرغب%20في%20تفعيل%20حسابي%20على%20منصة%20المكتب%20الفني.`;
            window.open(waUrl, '_blank');
        }
    }

    function activateUserSession(displayName) {
        isSubscriber = true;
        isGuest = false;
        document.getElementById('authModal').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        document.getElementById('userNameDisplay').innerText = 'مشترك مفعل (' + displayName + ')';
        document.getElementById('userBadge').classList.remove('hidden');
        document.getElementById('videoLockOverlay').classList.add('hidden');
        playVideo('https://www.youtube.com/embed/dQw4w9WgXcQ', '1. دورة إعداد الداتا وتجهيز شيتات الإكسيل', 'خطوات تنظيف النقاط، ترتيب الأعمدة، وتصدير الداتا بصيغة PNEZD.');
    }

    function continueAsGuest() {
        isGuest = true;
        isSubscriber = false;
        document.getElementById('authModal').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        document.getElementById('userNameDisplay').innerText = 'وضع الزائر';
        document.getElementById('userBadge').classList.remove('hidden');
        document.getElementById('videoLockOverlay').classList.remove('hidden');
    }

    function playVideo(url, title, desc) {
        if (!isSubscriber) {
            alert('عذراً، مشاهدة هذا الدرس متوفرة فقط للطلاب المشتركين المفعّلة أرقامهم.');
            return;
        }
        document.getElementById('mainVideoPlayer').src = url;
        document.getElementById('currentVideoTitle').innerText = title;
        document.getElementById('currentVideoDesc').innerText = desc;
    }

    function downloadFile(fileName) {
        if(isGuest) {
            alert('تنبيه: أنت تتصفح بوضع الزائر. يرجى تسجيل الدخول برقمك المفعل مجاناً لتحميل ملفات وشيتات المكتب الفني.');
        } else {
            alert('تم بدء تحميل: ' + fileName);
        }
    }
</script>
